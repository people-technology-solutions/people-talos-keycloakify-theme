name: Verify

on:
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Build Keycloak theme
        run: npm run build-keycloak-theme

      - uses: actions/upload-artifact@v7
        with:
          name: keycloak-theme-pr-${{ github.event.pull_request.number }}
          path: dist_keycloak/*.jar
          retention-days: 7
